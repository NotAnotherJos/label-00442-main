# ============================================================================
# Web Scraper - Docker Compose 配置
# ============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: web-scraper-backend
    ports:
      - "8082:8080"
    volumes:
      - scraper-data:/app/data
      - scraper-logs:/app/logs
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/scraper.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  scraper-data:
    driver: local
  scraper-logs:
    driver: local
